<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estaleiro de Inimigos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Libre+Franklin:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#E9EDF1;--surface:#FFFFFF;--surface2:#F3F6F8;--ink:#15213A;--muted:#5A6577;--line:#D3DAE2;
  --accent:#1D6A73;--accent-ink:#FFFFFF;--brass:#9C7020;--brass-soft:#F2E6CC;--danger:#B2372E;--ok:#2E7A4D;--warn:#9A6A08;
  --shadow:0 1px 2px rgba(21,33,58,.06),0 4px 14px rgba(21,33,58,.06);
  --display:"Pirata One","Georgia",serif;--body:"Libre Franklin",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#0C131D;--surface:#142031;--surface2:#192740;--ink:#E2E8F0;--muted:#95A1B3;--line:#29394F;
  --accent:#4DB0BA;--accent-ink:#0C131D;--brass:#D8A748;--brass-soft:#3A2F17;--danger:#E36B61;--ok:#5FBE84;--warn:#E0B24A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);}}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#0C131D;--surface:#142031;--surface2:#192740;--ink:#E2E8F0;--muted:#95A1B3;--line:#29394F;
  --accent:#4DB0BA;--accent-ink:#0C131D;--brass:#D8A748;--brass-soft:#3A2F17;--danger:#E36B61;--ok:#5FBE84;--warn:#E0B24A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;padding:0 16px}
.wrap{max-width:1380px;margin:0 auto;padding-block:20px 60px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;border-bottom:2px solid var(--brass);padding-bottom:12px;margin-bottom:18px}
header.top h1{font-family:var(--display);font-weight:400;font-size:2.6rem;line-height:1;margin:0;letter-spacing:.5px;text-wrap:balance}
header.top p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,.btn{font:inherit;font-weight:600;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:7px 11px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.ghost{background:transparent}
button.danger{color:var(--danger)}
button.small{padding:3px 8px;font-size:12px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);gap:20px;align-items:start}
@media (max-width:1050px){.layout{grid-template-columns:1fr}.side{position:static!important}}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:grid;gap:14px;max-height:calc(100vh - 24px);overflow:auto;padding-bottom:4px}
@media (max-width:1050px){.side{max-height:none;overflow:visible}}
details.mod{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:12px;box-shadow:var(--shadow)}
details.mod>summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
details.mod>summary::-webkit-details-marker{display:none}
details.mod>summary h2{margin:0;font-size:15px;font-weight:700;letter-spacing:.2px}
details.mod>summary .hint{color:var(--muted);font-size:12px}
details.mod>summary::after{content:"▾";margin-left:auto;color:var(--muted);transition:transform .15s}
details.mod:not([open])>summary::after{transform:rotate(-90deg)}
.step{font-family:var(--mono);font-size:11px;color:var(--brass);letter-spacing:.8px;text-transform:uppercase}
.body{padding:4px 16px 16px;display:grid;gap:14px}
.grid{display:grid;gap:10px 12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
label.f{display:grid;gap:3px;font-size:12px;color:var(--muted);font-weight:500}
label.f>span{letter-spacing:.2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:5px;padding:6px 8px;width:100%;min-width:0}
input[type=number]{font-family:var(--mono)}
input[type=checkbox]{width:auto;accent-color:var(--accent)}
textarea{min-height:56px;resize:vertical}
.sub{font-size:12px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);font-weight:700;margin:4px 0 -4px}
.attrs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media (max-width:560px){.attrs{grid-template-columns:repeat(3,minmax(0,1fr))}}
.attr{border:1px solid var(--line);border-radius:6px;padding:8px;text-align:center;background:var(--surface2)}
.attr b{display:block;font-size:11px;letter-spacing:1px;color:var(--muted)}
.attr input{text-align:center;font-size:18px;font-weight:600;padding:4px;background:var(--surface)}
.attr .mod{font-family:var(--mono);font-size:13px;color:var(--accent);font-weight:600;margin-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 7px;font-size:12px;background:var(--surface2);cursor:pointer;user-select:none}
.chip:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--surface))}
.card{border:1px solid var(--line);border-radius:7px;padding:12px;background:var(--surface2);display:grid;gap:10px}
.card-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card-h input.name{font-weight:600;flex:1 1 180px;background:var(--surface)}
.pill{font-family:var(--mono);font-size:12px;border-radius:999px;padding:2px 9px;background:var(--brass-soft);color:var(--brass);white-space:nowrap;font-weight:600}
.pill.teal{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.muted{color:var(--muted)}
.note{font-size:12px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.feat-group{border-top:1px solid var(--line);padding-top:8px}
.feat-group>summary{cursor:pointer;font-weight:600;padding:4px 0;display:flex;gap:8px;align-items:center}
.feat{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;padding:7px 4px;border-bottom:1px dashed var(--line)}
.feat:last-child{border-bottom:0}
.feat .fn{font-weight:600}
.feat .fe{font-family:var(--mono);font-size:11px;color:var(--brass);margin-left:6px}
.feat .fe.none{color:var(--muted)}
.feat .ft{grid-column:2;font-size:12px;color:var(--muted)}
.feat .fv{grid-column:2;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.feat .fv input{max-width:120px}
.feat.on{background:color-mix(in srgb,var(--accent) 7%,transparent);border-radius:4px}
/* result panel */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);overflow:hidden}
.nd-hero{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;padding:16px;border-bottom:2px solid var(--brass);background:linear-gradient(180deg,var(--surface2),var(--surface))}
.nd-big{font-family:var(--display);font-size:4rem;line-height:.9;color:var(--ink);grid-row:span 2}
.nd-big small{display:block;font-family:var(--body);font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:4px}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-self:end}
.kv div{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;font-weight:600}
.kv b{display:block;font-family:var(--mono);font-size:15px;color:var(--ink);letter-spacing:0;text-transform:none}
.split{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
.split>div{padding:12px 14px}
.split>div+div{border-left:1px solid var(--line)}
.split h3{margin:0 0 2px;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.split .v{font-family:var(--display);font-size:2rem;line-height:1}
.log{padding:10px 14px;font-size:12.5px;display:grid;gap:2px}
.log h4{margin:10px 0 4px;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--brass)}
.log h4:first-child{margin-top:0}
.lr{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dotted var(--line);padding:2px 0}
.lr span:last-child{font-family:var(--mono);white-space:nowrap;text-align:right}
.lr.tot{font-weight:700;border-bottom:1px solid var(--ink)}
.warns{padding:0 14px 12px;display:grid;gap:6px}
.w{font-size:12px;border-left:3px solid var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent);padding:6px 8px;border-radius:0 4px 4px 0}
.w.bad{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 10%,transparent)}
.w button{margin-top:4px}
/* stat block */
.sb{background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:16px}
.sb-name{font-family:var(--display);font-size:1.9rem;text-align:center;line-height:1.05;margin:0 0 8px;text-transform:uppercase;letter-spacing:1px;text-wrap:balance}
.sb-hdr{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 10px;font-size:12px;border-top:2px solid var(--brass);border-bottom:2px solid var(--brass);padding:6px 0;margin-bottom:8px}
.sb-hdr b{font-weight:700;letter-spacing:.3px}
.sb-attrs{display:grid;grid-template-columns:repeat(6,1fr);text-align:center;font-size:12px;padding:6px 0;border-bottom:1px solid var(--brass);margin-bottom:6px}
.sb-attrs b{display:block;font-size:11px;letter-spacing:1px;color:var(--brass)}
.sb-attrs span{font-family:var(--mono)}
.sb-sec{display:grid;grid-template-columns:92px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.sb-sec:last-child{border-bottom:0}
.sb-sec>h5{margin:0;font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--brass);font-weight:700}
.sb-sec p{margin:0 0 5px}
.sb-sec p:last-child{margin:0}
.sb-sec em{font-style:normal;font-weight:700}
@media (max-width:480px){.sb-sec{grid-template-columns:1fr;gap:2px}.sb-hdr{grid-template-columns:1fr 1fr}}
table.ref{border-collapse:collapse;font-size:12px;width:100%;font-variant-numeric:tabular-nums}
table.ref th,table.ref td{padding:3px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.ref th{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);position:sticky;top:0;background:var(--surface)}
table.ref td:first-child,table.ref th:first-child{text-align:left}
table.ref tr.hd td{background:color-mix(in srgb,var(--accent) 12%,transparent)}
table.ref tr.ho td{background:color-mix(in srgb,var(--brass) 14%,transparent)}
table.ref tr.hf td{font-weight:700;outline:1.5px solid var(--ink);outline-offset:-1.5px}
.tscroll{overflow-x:auto;max-height:360px;overflow-y:auto}
.modal{position:fixed;inset:0;background:rgba(8,14,24,.55);display:grid;place-items:center;padding:16px;z-index:10}
.modal>div{background:var(--surface);border-radius:10px;max-width:640px;width:100%;padding:18px;display:grid;gap:10px;max-height:90vh;overflow:auto}
.modal h3{margin:0;font-family:var(--display);font-weight:400;font-size:1.6rem}
.lib-item{display:flex;gap:8px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:6px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-weight:600;z-index:20}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Estaleiro de Inimigos</h1>
      <p>Monte inimigos do OP RPG módulo por módulo. O Nível de Desafio é recalculado a cada mudança, seguindo o passo a passo de <em>Criando um Inimigo</em> (Guia do Narrador 2.0, cap. 3.13), com todos os PV, CR, bônus de ataque e dano virtuais das características.</p>
    </div>
    <div class="toolbar">
      <select id="presetSel" aria-label="Carregar exemplo"></select>
      <button id="btnNew">Nova ficha</button>
      <button id="btnLib">Biblioteca</button>
      <button id="btnIO">Importar / exportar</button>
    </div>
  </header>
  <div class="layout">
    <main id="editor"></main>
    <aside class="side" id="side">
      <div class="panel" id="result"></div>
      <div class="sb" id="statblock"></div>
    </aside>
  </div>
</div>
<div id="modalRoot"></div>

<script>
/* ============ DADOS DAS REGRAS ============ */
const ND_LABELS=['0','1/8','1/4','1/2',...Array.from({length:30},(_,i)=>String(i+1))];
const ND_VAL=ND_LABELS.map(l=>l.includes('/')?1/(+l.split('/')[1]):+l);
// [prof, pp, CR, pvMin, pvMax, atk, dmgMin, dmgMax, CD]  — Guia do Narrador, "Estatísticas de Criatura por Nível de Desafio"
const T=[
[2,0,13,1,6,3,0,1,13],[2,0,13,7,10,3,2,3,13],[2,0,13,11,20,3,4,5,13],[2,0,13,21,30,3,6,8,13],
[2,5,14,31,60,5,9,14,13],[2,10,15,56,85,5,15,20,13],[2,15,16,81,130,6,21,26,13],[2,20,16,121,170,6,27,32,14],
[3,25,16,161,220,7,33,38,15],[3,30,17,201,260,7,39,44,15],[3,35,17,241,300,7,45,50,15],[3,40,17,281,440,8,51,56,16],
[4,45,18,421,561,8,57,62,16],[4,50,18,542,650,8,63,68,16],[4,55,18,601,710,9,69,74,17],[4,60,18,661,770,9,75,80,17],
[5,65,19,721,815,9,81,86,18],[5,70,19,766,860,10,87,92,18],[5,75,19,811,905,10,93,98,18],[5,80,19,856,950,10,99,104,18],
[6,85,20,901,1010,11,105,110,19],[6,90,20,961,1070,11,111,116,19],[6,95,20,1021,1130,11,117,122,19],[6,100,20,1081,1300,11,123,140,19],
[7,105,20,1201,1338,12,141,158,20],[7,110,20,1239,1375,12,159,176,20],[7,115,21,1276,1413,12,177,194,20],[7,120,21,1314,1450,13,195,212,21],
[8,125,21,1351,1588,13,213,230,21],[8,130,21,1389,1625,13,231,248,21],[8,135,22,1426,1663,14,249,266,22],[8,140,22,1464,1700,14,267,284,22],
[9,145,22,1501,1738,14,285,302,22],[9,150,23,1539,1850,15,303,320,23]
].map(r=>({prof:r[0],pp:r[1],ca:r[2],hpMin:r[3],hpMax:r[4],atk:r[5],dmgMin:r[6],dmgMax:r[7],cd:r[8]}));
const XP=[0,25,50,100,200,450,700,1100,1800,2300,2900,3900,5000,5900,7200,8400,10000,11500,13000,15000,18000,20000,22000,25000,33000,41000,50000,62000,75000,90000,105000,120000,135000,155000];
const ATTRS=['FOR','DES','CON','SAB','PRE','VON'];
const ATTR_NAME={FOR:'Força',DES:'Destreza',CON:'Constituição',SAB:'Sabedoria',PRE:'Presença',VON:'Vontade'};
const DMG_TYPES=['Ácido','Contundente','Cortante','Elétrico','Energia','Fogo','Frio','Perfurante','Psíquico','Trovejante','Veneno','Verdadeiro'];
const PHYS=['Contundente','Cortante','Perfurante'];
const CONDS=['Agarrado','Amedrontado','Atordoado','Bêbado','Caído','Cego','Enfeitiçado','Enfraquecido','Envenenado','Estremecido','Exaustão','Impedido','Incapacitado','Inconsciente','Letárgico','Paralisado','Queimado','Sangramento','Sonolento','Sufocado','Surdo'];
const SIZES={'Miúdo':{die:4,scale:1},'Pequeno':{die:6,scale:1},'Médio':{die:8,scale:1},'Grande':{die:10,scale:2},'Enorme':{die:12,scale:3},'Imenso':{die:20,scale:4}};
const SKILLS=[['Acrobacia','DES'],['Atletismo','FOR'],['Atuação','PRE'],['Enganação','PRE'],['Furtividade','DES'],['Haki','VON'],['História','SAB'],['Intimidação','PRE'],['Intuição','VON'],['Investigação','SAB'],['Medicina','SAB'],['Natureza','SAB'],['Percepção','VON'],['Persuasão','PRE'],['Prestidigitação','DES'],['Provocação','PRE'],['Sobrenatural','VON'],['Sobrevivência','SAB'],['Sorte','VON']];
// multiplicadores de PV virtual por faixa de ND pretendido
const HP_MULT=[{max:4,res:2,inv:2,logia:3},{max:10,res:1.5,inv:2,logia:2.5},{max:16,res:1.25,inv:1.5,logia:2},{max:99,res:1,inv:1.25,logia:1.5}];
const WEAPONS=[
 {n:'Ataque Desarmado',kind:'melee',wt:'unarmed',attr:'FOR',dn:1,die:4,type:'Contundente',reach:'alcance 1,5 metro',scale:false},
 {n:'Sabre',kind:'melee',wt:'weapon',attr:'FOR',dn:1,die:6,type:'Cortante',reach:'alcance 1,5 metro',scale:true},
 {n:'Katana',kind:'melee',wt:'weapon',attr:'FOR',dn:1,die:8,type:'Cortante',reach:'alcance 1,5 metro',scale:true},
 {n:'Adaga',kind:'melee',wt:'weapon',attr:'DES',dn:1,die:4,type:'Perfurante',reach:'alcance 1,5 metro',scale:true},
 {n:'Machado Grande',kind:'melee',wt:'weapon',attr:'FOR',dn:1,die:12,type:'Cortante',reach:'alcance 1,5 metro',scale:true},
 {n:'Nodachi',kind:'melee',wt:'weapon',attr:'FOR',dn:2,die:6,type:'Cortante',reach:'alcance 3 metros',scale:true},
 {n:'Pistola',kind:'ranged',wt:'weapon',attr:'DES',dn:1,die:6,type:'Contundente',reach:'distância 9/15 metros',scale:true},
 {n:'Mosquete',kind:'ranged',wt:'weapon',attr:'DES',dn:1,die:8,type:'Contundente',reach:'distância 18/24 metros',scale:true},
 {n:'Mordida',kind:'melee',wt:'natural',attr:'FOR',dn:2,die:10,type:'Perfurante',reach:'alcance 1,5 metro',scale:false},
 {n:'Garras',kind:'melee',wt:'natural',attr:'FOR',dn:2,die:8,type:'Cortante',reach:'alcance 1,5 metro',scale:false},
];

/* ============ CATÁLOGO DE CARACTERÍSTICAS ============
 e: efeitos no ND. Tipos:
  ca(v) CR virtual | atk(v) bônus de ataque virtual | hpPct(v,max/min ND) | hpMul(v) | hp3x (3× valor informado)
  dmg (valor por rodada) | dmgR1 (valor só 1ª rodada) | dmgX2 (valor × 2 alvos) | dmgPct(v) | r1x2 (dobra dano da 1ª rodada)
  nd(v,max) | ndLvl (valor = níveis) | xdice(scope) extra dados de arma | flat(v) dano fixo por ataque corpo a corpo
 slot: onde aparece na ficha (asp, bon, pod, rea, len, acao)
 val: rótulo do valor pedido */
const G_ASP='Aspectos',G_BON='Ações Bônus',G_POD='Ações Poderosas',G_REA='Reações',G_LEN='Características Lendárias',G_MAN='Vistas nas fichas do Manual dos Inimigos';
const F=[];
function f(g,id,n,slot,e,t,val,extra){F.push(Object.assign({g,id,n,slot,e:e||[],t,val},extra||{}))}
// Aspectos
f(G_ASP,'absEle','Absorção de Eletricidade','asp',0,'Sempre que for alvo de dano Elétrico, não sofre dano e recupera PV igual ao dano Elétrico recebido.');
f(G_ASP,'agarrador','Agarrador','asp',0,'Vantagem nas jogadas de ataque (comum) contra qualquer criatura agarrada por ela.');
f(G_ASP,'andarTeias','Andar em Teias','asp',0,'Ignora as restrições de movimento causadas por teias.');
f(G_ASP,'andarGelo','Andar no Gelo','asp',0,'Move-se em superfícies congeladas sem Teste de Atributo; terreno difícil de gelo ou neve não custa movimento extra.');
f(G_ASP,'anfibio','Anfíbio','asp',0,'Pode respirar ar e água.');
f(G_ASP,'aparFalsa','Aparência Falsa','asp',0,'Enquanto permanecer imóvel, é indistinguível de um objeto ou estrutura.');

function diceAvg(s){ // "4d6+2", "2d10", "11"
  if(s===undefined||s===null||s==='')return 0; if(typeof s==='number')return s;
  let tot=0; const str=String(s).replace(/\s/g,'').replace(/−/g,'-');
  const re=/([+-]?)(\d*)d(\d+)|([+-]?)(\d+(?:[.,]\d+)?)/gi; let m;
  while((m=re.exec(str))){ if(m[3]){const sgn=m[1]==='-'?-1:1;tot+=sgn*(+(m[2]||1))*(+m[3]+1)/2}else if(m[5]){const sgn=m[4]==='-'?-1:1;tot+=sgn*parseFloat(m[5].replace(',','.'))}}
  return tot;
}

/* ============ CÁLCULO ============ */
function activeFeats(){const out=[];for(const id in S.feats){const ft=FEAT_BY_ID[id];if(ft)out.push({ft,val:S.feats[id].val})}
  S.custom.forEach(c=>out.push({ft:{id:c.id,n:c.name,slot:c.slot,t:c.text,e:c.eff&&c.eff!=='none'?[[c.eff,+c.v||0]]:[],custom:true},val:c.val}));return out}
function profOf(idx){return T[idx].prof}
function sizeInfo(){return SIZES[S.size]||SIZES['Médio']}
function hitDie(){return +S.hdDie||sizeInfo().die}
function hpInfo(){const con=mod(S.attrs.CON);if(S.hpMode==='manual')return{hp:+S.hpManual||0,expr:''};
  const n=+S.hd||0,d=hitDie();const hp=Math.max(1,Math.floor(n*(d+1)/2+n*con));const b=n*con;return{hp,expr:`${n}d${d}${b?(b>0?'+':'')+b:''}`}}
function caReal(){return S.caMode==='manual'?(+S.caManual||0):10+mod(S.attrs.DES)+(+S.caNat||0)}
function basicProf(res){return S.profMode==='final'&&res?profOf(res.finalIdx):profOf(S.ndTarget)}
function attackCalc(a,prof,feats){
  const scale=a.scale&&a.wt==='weapon'?sizeInfo().scale:1;
  let extra=0,flat=0;const notes=[];
  feats.forEach(({ft,val})=>ft.e.forEach(([t,v,sc])=>{
    if(t==='xdice'){const n=typeof sc==='number'?sc:(+val||0);const scope=v;
      const isW=a.wt==='weapon',isU=a.wt==='unarmed',mel=a.kind==='melee';
      let ok=false;if(scope==='mw')ok=mel&&(isW||isU);else if(scope==='slash')ok=isW&&/Cortante/.test(a.type);else if(scope==='w')ok=isW;else if(scope==='wu')ok=isW||isU;
      if(ok&&n){extra+=n;notes.push(`${ft.n} +${n}d`)}}
    if(t==='flat'&&a.kind==='melee'){flat+=v;notes.push(`${ft.n} +${v}`)}
  }));
  const hk=[0,2,3,4][S.haki.arm||0];if(hk){extra+=hk;notes.push(`Haki do Armamento +${hk}d`)}
  const m=a.attr==='—'?0:mod(S.attrs[a.attr]||10);
  const dn=(+a.dn||0)*scale+extra, die=+a.die||0, fl=m+(+a.flat||0)+flat;
  const avg=Math.max(0,Math.floor(dn*(die+1)/2+fl));
  const bonus=a.bonus!==''&&a.bonus!==null&&a.bonus!==undefined?+a.bonus:prof+m;
  return{dn,die,fl,avg,bonus,notes,scale}}
function techCalc(t,prof){
  const hk=t.form==='ataque'?[0,2,3,4][S.haki.arm||0]:0;
  const dn=(+t.dn||0)+hk,die=+t.die||0,fl=+t.flat||0;
  const one=Math.max(0,Math.floor(dn*(die+1)/2+fl));
  const tg=t.form==='area'?Math.max(1,+t.targets||1):1;
  const m=mod(S.attrs[t.attr]||10);
  return{dn,die,fl,one,avg:t.form==='aux'?0:one*tg,tg,bonus:prof+m}}
function cdValue(prof){return S.cdOverride!==''&&S.cdOverride!=null?+S.cdOverride:8+prof+mod(S.attrs[S.cdAttr]||10)}

function compute(){
  const tIdx=+S.ndTarget, tND=ND_VAL[tIdx];
  const prof=profOf(tIdx);
  const feats=activeFeats();
  const R={logD:[],logO:[],warns:[],prof};
  const E=[];feats.forEach(({ft,val})=>ft.e.forEach(e=>E.push({ft,val,t:e[0],v:e[1],o:e[2]})));
  // ---------- DEFENSIVO ----------
  const {hp,expr}=hpInfo();R.hp=hp;R.hpExpr=expr;
  let hpV=hp;R.logD.push(['PV reais',fmt(hp)]);
  const band=HP_MULT.find(b=>tND<=b.max);
  const resAll=PHYS.every(x=>S.res.includes(x))||S.res.length>=3;
  const invAll=PHYS.every(x=>S.inv.includes(x))||S.inv.length>=3;
  let mult=1,mlab='';
  if(resAll&&band.res>mult){mult=band.res;mlab='resistências'}
  if(invAll&&band.inv>mult){mult=band.inv;mlab='invulnerabilidades'}
  if(S.logia&&band.logia>mult){mult=band.logia;mlab='intangibilidade Logia'}
  if(mult!==1){hpV*=mult;R.logD.push([`× ${String(mult).replace('.',',')} por ${mlab} (ND pretendido ${ND_LABELS[tIdx]})`,fmt(hpV)])}
  else if(S.res.length||S.inv.length)R.logD.push(['Resistências/invulnerabilidades sem multiplicador (menos de 3 tipos ou sem C/C/P, ou faixa ND 17+)','×1']);
  const vulAll=PHYS.every(x=>S.vul.includes(x))||S.vul.length>=3;
  if(vulAll){hpV*=.5;R.logD.push(['× 0,5 por vulnerabilidades a vários tipos',fmt(hpV)])}
  let pct=0;E.filter(e=>e.t==='hpPct').forEach(e=>{const o=e.o||{};if(o.max!==undefined&&tND>o.max){R.logD.push([`${e.ft.n}: sem efeito (ND pretendido > ${o.max})`,'—']);return}
    if(o.min!==undefined&&tND<o.min){R.logD.push([`${e.ft.n}: sem efeito (ND pretendido < ${o.min})`,'—']);return}pct+=e.v;R.logD.push([`${e.ft.n}`,`+${e.v}%`])});
  if(+S.adj.hpPct){pct+=+S.adj.hpPct;R.logD.push(['Ajuste manual de PV',`${sg(+S.adj.hpPct)}%`])}
  if(pct){const base=hpV;hpV=hpV*(1+pct/100);R.logD.push([`Soma dos % sobre ${fmt(base)}`,fmt(hpV)])}
  E.filter(e=>e.t==='hpMul').forEach(e=>{hpV*=e.v;R.logD.push([`${e.ft.n} ×${e.v}`,fmt(hpV)])});
  E.filter(e=>e.t==='hp3x').forEach(e=>{const v=diceAvg(e.val);if(v){hpV+=3*v;R.logD.push([`${e.ft.n}: 3 × ${fmt(v)}`,`+${fmt(3*v)}`])}else R.warns.push({m:`Informe o valor de "${e.ft.n}" para ele contar nos PV virtuais.`})});
  hpV=Math.floor(hpV);R.hpV=hpV;R.logD.push(['PV virtuais','= '+fmt(hpV),'tot']);
  let hpIdx=T.findIndex(r=>hpV<=r.hpMax);if(hpIdx<0){hpIdx=T.length-1;R.warns.push({m:'PV virtuais acima da tabela (1.850): ND defensivo limitado a 30.'})}
  R.hpIdx=hpIdx;R.logD.push([`ND pelos PV (faixa ${fmt(T[hpIdx].hpMin)}–${fmt(T[hpIdx].hpMax)})`,ND_LABELS[hpIdx],'tot']);
  const ca=caReal();let caV=ca;R.ca=ca;R.logD.push(['CR real',ca]);
  E.filter(e=>e.t==='ca').forEach(e=>{caV+=e.v;R.logD.push([e.ft.n,sg(e.v)])});
  const nSaves=S.saves.length;if(nSaves>=6){caV+=4;R.logD.push(['6 bônus em Salvaguardas','+4'])}else if(nSaves>=3){caV+=2;R.logD.push([`${nSaves} bônus em Salvaguardas`,'+2'])}
  const hasRanged=S.attacks.some(a=>a.kind==='ranged')||S.techs.some(t=>t.form==='area'||/Dist/i.test(t.range));
  if(+S.speed.fly>0&&hasRanged&&tND<=10){caV+=2;R.logD.push(['Voa e causa dano à distância (ND pretendido ≤ 10)','+2'])}
  else if(+S.speed.fly>0&&tND<=10&&!hasRanged)R.logD.push(['Voo sem dano à distância: sem bônus','—']);
  if(+S.adj.ca){caV+=+S.adj.ca;R.logD.push(['Ajuste manual de CR',sg(+S.adj.ca)])}
  R.caV=caV;R.logD.push(['CR virtual','= '+caV,'tot']);
  const caExp=T[hpIdx].ca,caDiff=caV-caExp,caAdj=Math.trunc(caDiff/2);
  R.logD.push([`CR esperada p/ ND ${ND_LABELS[hpIdx]}: ${caExp} (diferença ${sg(caDiff)})`,caAdj?`${sg(caAdj)} ND`:'sem ajuste']);
  const defIdx=clampIdx(hpIdx+caAdj);R.defIdx=defIdx;
  // ---------- OFENSIVO ----------
  const aCalc={};S.attacks.forEach(a=>aCalc[a.id]=attackCalc(a,prof,feats));R.aCalc=aCalc;
  let actionDmg=0,primary=null,primaryVal=-1;const actParts=[];
  if(S.multi.length){S.multi.forEach(m=>{const c=aCalc[m.atk];if(!c)return;const a=S.attacks.find(x=>x.id===m.atk);const v=c.avg*(+m.times||0);actionDmg+=v;actParts.push(`${m.times}× ${a.name} (${c.avg})`);if(v>primaryVal){primaryVal=v;primary=c}})}
  else{S.attacks.forEach(a=>{const c=aCalc[a.id];if(c.avg>primaryVal){primaryVal=c.avg;primary=c;actionDmg=c.avg;actParts.length=0;actParts.push(`1× ${a.name} (${c.avg})`)}})}
  R.actionDmg=actionDmg;
  const perRound=[],r1Only=[];let pctD=0,r1x2=false,flatAdj=+S.adj.dmg||0;const pctNames=[];
  E.forEach(e=>{if(e.t==='dmg'){const v=diceAvg(e.val);if(v)perRound.push([e.ft.n,v]);else if(e.ft.val)R.warns.push({m:`Informe o dano de "${e.ft.n}" para ele entrar no dano por rodada.`})}
    if(e.t==='dmgX2'){const v=diceAvg(e.val);if(v)perRound.push([e.ft.n+' (2 alvos)',2*v]);else R.warns.push({m:`Informe o dano de "${e.ft.n}".`})}
    if(e.t==='dmgR1'){const v=diceAvg(e.val);if(v)r1Only.push([e.ft.n,v]);else R.warns.push({m:`Informe o dano de "${e.ft.n}" para ele contar na 1ª rodada.`})}
    if(e.t==='dmgPct'){pctD+=e.v;pctNames.push(`${e.ft.n} +${e.v}%`)}
    if(e.t==='r1x2')r1x2=e.ft.n});
  const budget=S.ppOverride!==''&&S.ppOverride!=null?+S.ppOverride:T[tIdx].pp;
  const tc={};S.techs.forEach(t=>tc[t.id]=techCalc(t,prof));R.tc=tc;
  const uses={};let ppUsed=0;
  const avail=t=>{if(t.form==='aux'||tc[t.id].avg<=0)return false;const u=uses[t.id]||0;
    if(t.use==='dia'&&u>=(+t.perDay||0))return false;if((t.use==='rec56'||t.use==='rec46'||t.use==='rec6')&&u>=1)return false;
    if(ppUsed+(+t.pp||0)>budget)return false;return true};
  const pick=act=>{let b=null;S.techs.filter(t=>t.act===act&&avail(t)).forEach(t=>{if(!b||tc[t.id].avg>tc[b.id].avg)b=t});return b};
  const use=t=>{uses[t.id]=(uses[t.id]||0)+1;ppUsed+=(+t.pp||0)};
  const legC=aCalc[S.leg.atk];const legAttacks=S.leg.count>0&&legC?Math.floor((+S.leg.count)/Math.max(1,+S.leg.cost||1)):0;
  const rounds=[];
  for(let r=1;r<=3;r++){const parts=[];let tot=0;
    const best=pick('poderosa');
    if(S.opt.dmgMode==='ambas'){ if(actionDmg){tot+=actionDmg;parts.push(['Ação: '+actParts.join(' + '),actionDmg])} if(best){use(best);tot+=tc[best.id].avg;parts.push(['Ação Poderosa: '+best.name+(tc[best.id].tg>1?` (×${tc[best.id].tg} alvos)`:''),tc[best.id].avg])} }
    else{ if(best&&tc[best.id].avg>actionDmg){use(best);tot+=tc[best.id].avg;parts.push(['Ação Poderosa: '+best.name+(tc[best.id].tg>1?` (×${tc[best.id].tg} alvos)`:''),tc[best.id].avg])}
          else if(actionDmg){tot+=actionDmg;parts.push(['Ação: '+actParts.join(' + '),actionDmg])} }
    const bb=pick('bonus');if(bb){use(bb);tot+=tc[bb.id].avg;parts.push(['Ação Bônus: '+bb.name,tc[bb.id].avg])}
    const rr=pick('reacao');if(rr){use(rr);tot+=tc[rr.id].avg;parts.push(['Reação: '+rr.name,tc[rr.id].avg])}
    if(legAttacks){const v=legAttacks*legC.avg;tot+=v;parts.push([`Ações Lendárias: ${legAttacks}× ${S.attacks.find(a=>a.id===S.leg.atk).name}`,v])}
    perRound.forEach(([n,v])=>{tot+=v;parts.push([n,v])});
    if(r===1)r1Only.forEach(([n,v])=>{tot+=v;parts.push([n+' (1ª rodada)',v])});
    if(r===1&&r1x2&&tot){parts.push([r1x2+': dobra a 1ª rodada',tot]);tot*=2}
    rounds.push({tot,parts})}
  R.rounds=rounds;R.ppUsed=ppUsed;R.budget=budget;
  let dmg=(rounds[0].tot+rounds[1].tot+rounds[2].tot)/3;
  R.dmgBase=dmg;
  if(pctD){dmg*=1+pctD/100}
  if(flatAdj)dmg+=flatAdj;
  dmg=Math.floor(dmg);R.dmg=dmg;R.pctD=pctD;R.pctNames=pctNames;
  let dIdx=T.findIndex(r=>dmg<=r.dmgMax);if(dIdx<0){dIdx=T.length-1;R.warns.push({m:'Dano por rodada acima da tabela (320): ND ofensivo limitado a 30.'})}
  R.dmgIdx=dIdx;
  const cd=cdValue(prof);R.cd=cd;
  const baseAtk=primary?primary.bonus:prof;let atkV=S.opt.useDC?cd:baseAtk;const atkLog=[];
  atkLog.push([S.opt.useDC?'CD de Salvaguarda (usada no lugar do ataque)':'Bônus de ataque principal',sg(atkV)]);
  E.filter(e=>e.t==='atk').forEach(e=>{atkV+=e.v;atkLog.push([e.ft.n,sg(e.v)])});
  if(+S.adj.atk){atkV+=+S.adj.atk;atkLog.push(['Ajuste manual de ataque',sg(+S.adj.atk)])}
  R.atkV=atkV;R.atkLog=atkLog;
  const atkExp=S.opt.useDC?T[dIdx].cd:T[dIdx].atk,atkDiff=atkV-atkExp,atkAdj=Math.trunc(atkDiff/2);
  R.atkExp=atkExp;R.atkDiff=atkDiff;R.atkAdj=atkAdj;
  const offIdx=clampIdx(dIdx+atkAdj);R.offIdx=offIdx;
  // ---------- FINAL ----------
  const avg=(ND_VAL[defIdx]+ND_VAL[offIdx])/2;let fIdx=ndIdxNearest(avg);R.avgIdx=fIdx;R.avgVal=avg;
  const ndAdds=[];E.filter(e=>e.t==='nd').forEach(e=>{const o=e.o||{};if(o.max!==undefined&&ND_VAL[fIdx]>o.max){ndAdds.push([e.ft.n+` (sem efeito, ND > ${o.max})`,0]);return}ndAdds.push([e.ft.n,e.v])});
  E.filter(e=>e.t==='ndLvl').forEach(e=>{const v=Math.min(3,Math.max(0,+e.val||0));ndAdds.push([`${e.ft.n} (${v} nív.)`,v])});
  if(+S.adj.nd)ndAdds.push(['Ajuste manual',+S.adj.nd]);
  const addSum=ndAdds.reduce((s,x)=>s+x[1],0);
  if(addSum){fIdx=fIdx<4&&addSum>0?clampIdx(3+addSum):clampIdx(fIdx+addSum)}
  R.ndAdds=ndAdds;R.finalIdx=fIdx;R.xp=XP[fIdx];R.finalProf=profOf(fIdx);R.finalPP=T[fIdx].pp;
  // avisos
  if(R.finalProf!==prof&&S.profMode==='target')R.warns.push({m:`O ND final (${ND_LABELS[fIdx]}) tem bônus de proficiência ${sg(R.finalProf)}, mas a ficha foi montada com ${sg(prof)} (ND pretendido ${ND_LABELS[tIdx]}). Ajuste o ND pretendido e recalcule.`,fix:'adopt'});
  else if(fIdx!==tIdx)R.warns.push({m:`ND final ${ND_LABELS[fIdx]} difere do pretendido (${ND_LABELS[tIdx]}). Os multiplicadores de PV e as condições de ND usam o pretendido.`,fix:'adopt'});
  const ppNeed=S.techs.reduce((s,t)=>s+(+t.pp||0),0);
  S.techs.forEach(t=>{if(t.act==='poderosa'&&t.form!=='aux'&&tc[t.id].avg>0&&(+t.pp||0)>budget)R.warns.push({m:`"${t.name}" custa ${t.pp} PP, mais que os ${budget} PP disponíveis. Ela não entrou no cálculo.`,bad:true})});
  if(!S.attacks.length&&!S.techs.length)R.warns.push({m:'Sem ataques nem técnicas: o dano por rodada é 0 e o ND ofensivo fica em 0.'});
  if(S.multi.some(m=>!aCalc[m.atk]))R.warns.push({m:'Há uma linha de Ataques Múltiplos apontando para um ataque removido.',bad:true});
  return R}

  const rows=T.map((t,i)=>{const cls=[i===R.hpIdx||i===R.defIdx?'hd':'',i===R.dmgIdx||i===R.offIdx?'ho':'',i===f?'hf':''].join(' ');

    const head=t.cat==='combate'?`Técnica de Combate – ${t.grau}º Grau | Custo: ${t.pp} PP${use}`:t.cat==='auxiliar'?`Técnica Auxiliar | Custo: ${t.pp} PP${use}`:`${t.pp?`Custo: ${t.pp} PP`:''}${use}`.replace(/^ \| /,'');
    let body='';
    if(t.form==='ataque')body=`Ataque ${/dist/i.test(t.range)?'à Distância':'Corpo a Corpo'}: ${sg(c.bonus)} para atingir, ${esc(t.range)}.<br>Acerto: ${c.one} (${c.dn}d${c.die}${c.fl?sg(c.fl):''}) de dano ${esc(t.type)}.${t.effect?`<br>Efeito: ${esc(t.effect)}`:''}`;
    else if(t.form==='area')body=`Efeito em área, alcance de ${esc(t.range)}. Dano: ${c.one} (${c.dn}d${c.die}${c.fl?sg(c.fl):''}) ${esc(t.type)}. Toda criatura dentro da área da técnica deve fazer uma Salvaguarda de ${ATTR_NAME[t.saveAttr]} CD ${cd}. Sofrendo todo o dano se falhar ou metade desse dano se obtiver sucesso.${t.effect?` ${esc(t.effect)}`:''}`;
    else body=esc(t.effect||'');
    return`<em>${esc(t.name)}${head?` (${head})`:''}:</em> ${body}`};
  const bon=[...bySlot.bon,...S.techs.filter(t=>t.act==='bonus').map(techLine)];if(bon.length)P.push(['Ações Bônus',bon]);
  const rea=[...bySlot.rea,...S.techs.filter(t=>t.act==='reacao').map(techLine)];if(rea.length)P.push(['Reações',rea]);
  const pod=[...bySlot.pod,...S.techs.filter(t=>t.act==='poderosa').map(techLine)];if(pod.length)P.push(['Ações Poderosas',pod]);
  if(+S.leg.count>0){const L=[`<em>Figura Lendária:</em> Pode realizar ${S.leg.count} ações lendárias, escolhidas dentre as opções abaixo. Apenas uma ação lendária pode ser usada por vez e apenas no final do turno de outra criatura. Recupera as ações lendárias gastas no começo do turno dela.`];
    const la=S.attacks.find(a=>a.id===S.leg.atk);if(la)L.push(`<em>Ataque${+S.leg.cost>1?` (Custa ${S.leg.cost} Ações Lendárias)`:''}:</em> Realiza um ataque de ${esc(la.name)}.`);
    String(S.leg.extra||'').split('\n').filter(x=>x.trim()).forEach(x=>{const i=x.indexOf(':');L.push(i>0?`<em>${esc(x.slice(0,i))}:</em>${esc(x.slice(i+1))}`:esc(x))});
    P.push(['Ações Lendárias',L])}
  return{hdr,P}}
function renderBlock(R){
  const {hdr,P}=buildBlock(R);
  $('#statblock').innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:8px"><span class="step">Ficha no formato do Manual</span><span class="row"><button class="small" id="btnCopy">Copiar texto</button><button class="small" id="btnSave">Salvar na biblioteca</button></span></div>
  <h3 class="sb-name">${esc(S.name)}</h3>
  <div class="sb-hdr"><div><b>Nível de Desafio:</b> ${hdr.nd}</div><div><b>Experiência:</b> ${hdr.xp}</div><div><b>Pontos de Poder:</b> ${hdr.pp}</div>
    <div><b>Classe de Resistência:</b> ${hdr.ca}</div><div><b>Bônus de Proficiência:</b> ${hdr.prof}</div><div><b>Deslocamento:</b> ${hdr.walk}</div>
    <div><b>Pontos de Vida:</b> ${hdr.hp}</div><div><b>Classe de Dificuldade:</b> ${hdr.cd}</div><div>${hdr.extra.join('<br>')||''}</div></div>
  <div class="sb-attrs">${ATTRS.map(a=>`<div><b>${a}</b><span>${S.attrs[a]} (${mod(S.attrs[a])>0?'+':''}${mod(S.attrs[a])})</span></div>`).join('')}</div>
  ${P.map(([t,ps])=>`<div class="sb-sec"><h5>${t}</h5><div>${ps.map(p=>`<p>${p}</p>`).join('')}</div></div>`).join('')}
  ${S.notes?`<div class="sb-sec"><h5>Notas</h5><div><p>${esc(S.notes)}</p></div></div>`:''}`;
}
function blockText(R){const {hdr,P}=buildBlock(R);const strip=h=>h.replace(/<br>/g,'\n').replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"');
  let t=`${S.name.toUpperCase()}\nNÍVEL DE DESAFIO: ${hdr.nd}   EXPERIÊNCIA: ${hdr.xp}   PONTOS DE PODER: ${hdr.pp}\nClasse de Resistência: ${hdr.ca}   Bônus de Proficiência: ${hdr.prof}   Deslocamento: ${hdr.walk}\nPontos de Vida: ${hdr.hp}   Classe de Dificuldade: ${hdr.cd}${hdr.extra.length?'   '+hdr.extra.join('   '):''}\n`;
  t+=ATTRS.map(a=>`${a} ${S.attrs[a]} (${sg(mod(S.attrs[a])).replace('+0','0')})`).join('  ')+'\n';
  P.forEach(([title,ps])=>{t+=`\n${title.toUpperCase()}\n`+ps.map(p=>strip(p)).join('\n')+'\n'});if(S.notes)t+=`\nNOTAS\n${S.notes}\n`;return t}
let lastR=null;
function refresh(R){R=R||compute();lastR=R;renderResult(R);renderBlock(R);store.set('opEnemyDraft',S)}
function softUpdate(){ // atualiza números do editor sem redesenhar
  const R=compute();
  ATTRS.forEach(a=>{const el=$('#m_'+a);if(el)el.textContent=sg(mod(S.attrs[a]))});
  const hp=hpInfo();const hl=$('#hpLine');if(hl)hl.innerHTML=`PV: <b>${fmt(hp.hp)}</b> ${hp.expr?`(${hp.expr})`:''} · CR: <b>${caReal()}</b>. As fichas humanas do Manual usam d10/d12 em criaturas Médias; troque o dado se quiser seguir esse padrão.`;
  S.attacks.forEach(a=>{const c=R.aCalc[a.id];const p=$('#ap_'+a.id);if(p)p.textContent=`${sg(c.bonus)} · ${c.avg} (${c.dn}d${c.die}${c.fl?sg(c.fl):''})`;const n=$('#an2_'+a.id);if(n)n.textContent=c.notes.length?'Inclui: '+c.notes.join(', '):''});
  S.techs.forEach(t=>{const c=R.tc[t.id];const p=$('#tp_'+t.id);if(p)p.textContent=t.form==='aux'?'sem dano':`${c.avg} dano${c.tg>1?` (${c.one} × ${c.tg})`:''}`});
  const pb=$('#ppBudget');if(pb)pb.textContent=R.budget;
  for(const id in S.feats){const el=$('#fva_'+id);if(el)el.textContent='média '+fmt(diceAvg(S.feats[id].val))}
  refresh(R)}

/* ============ EVENTOS ============ */
function setPath(path,val){const ks=path.split('.');let o=S;for(let i=0;i<ks.length-1;i++)o=o[ks[i]];const last=ks[ks.length-1];
  if(val==='true')val=true;else if(val==='false')val=false;o[last]=val}
function coerce(el){if(el.type==='checkbox')return el.checked;if(el.type==='number')return el.value===''?'':+el.value;
  const k=el.dataset.k||'';if(/^(ndTarget|haki\.|attacks\.\d+\.die|techs\.\d+\.(die|grau)|hdDie)/.test(k))return el.value===''?'':+el.value;return el.value}
document.addEventListener('input',ev=>{const el=ev.target;
  if(el.id==='featSearch'){featFilter=el.value;const pos=el.selectionStart;renderEditor();const s=$('#featSearch');s.focus();s.setSelectionRange(pos,pos);return}
  if(el.dataset.k){setPath(el.dataset.k,coerce(el));if(el.dataset.re||el.tagName==='SELECT'&&/ndTarget|size|caMode|hpMode|\.kind|\.cat|\.use|\.form|haki/.test(el.dataset.k))renderEditor();else softUpdate();return}
  if(el.dataset.arr){const arr=S[el.dataset.arr];const v=el.dataset.val;const i=arr.indexOf(v);if(el.checked&&i<0)arr.push(v);if(!el.checked&&i>=0)arr.splice(i,1);softUpdate();return}
  if(el.dataset.skill){const v=+el.value;if(v)S.skills[el.dataset.skill]=v;else delete S.skills[el.dataset.skill];softUpdate();return}
  if(el.dataset.feat){const id=el.dataset.feat;if(el.checked){const ft=FEAT_BY_ID[id];S.feats[id]={val:ft&&ft.def?ft.def:''}}else delete S.feats[id];renderEditor();return}
  if(el.dataset.featval){S.feats[el.dataset.featval].val=el.value;softUpdate();return}
  if(el.id==='weapPreset'){const v=el.value;if(v==='')return;const w=v==='custom'?{n:'Novo ataque',kind:'melee',wt:'natural',attr:'FOR',dn:1,die:8,type:'Contundente',reach:'alcance 1,5 metro',scale:false}:WEAPONS[+v];
    const a=atk({name:w.n,kind:w.kind,wt:w.wt,attr:w.attr,dn:w.dn,die:w.die,type:w.type,reach:w.reach,scale:w.scale});S.attacks.push(a);if(!S.multi.length)S.multi.push({atk:a.id,times:1});renderEditor();return}
  if(el.id==='presetSel'){const p=PRESETS[+el.value];if(p){S=Object.assign(blank(),p[1]());featFilter='';renderEditor();toast(`Exemplo carregado: ${S.name}`)}el.value='';return}
});
document.addEventListener('toggle',ev=>{const d=ev.target;if(d.dataset&&d.dataset.mod){openState[d.dataset.mod]=d.open;store.set('opEnemyOpen',openState)}
  if(d.dataset&&d.dataset.fg){openState['fg_'+d.dataset.fg]=d.open;store.set('opEnemyOpen',openState)}
  if(d.dataset&&d.dataset.log){openState.log=d.open;store.set('opEnemyOpen',openState)}
  if(d.dataset&&d.dataset.tab){openState.tab=d.open;store.set('opEnemyOpen',openState)}},true);
document.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;
  if(b.dataset.del){const arr=S[b.dataset.del];const [rm]=arr.splice(+b.dataset.i,1);if(b.dataset.del==='attacks'){S.multi=S.multi.filter(m=>m.atk!==rm.id);if(S.leg.atk===rm.id)S.leg.atk=''}renderEditor();return}
  if(b.dataset.suggest!==undefined){const t=S.techs[+b.dataset.suggest];if(t.form==='area'){t.dn=[2,4,6,8,10,12,14][t.grau-1];t.die=6}else{t.dn=[2,4,6,8,10,12,15][t.grau-1];t.die=10}renderEditor();return}
  if(b.dataset.adopt){S.ndTarget=lastR.finalIdx;renderEditor();toast(`ND pretendido agora é ${ND_LABELS[S.ndTarget]}`);return}
  switch(b.id){
    case'addMulti':S.multi.push({atk:S.attacks[0].id,times:1});renderEditor();break;
    case'addTech':S.techs.push(tech({name:'Nova Técnica',grau:1,pp:2}));renderEditor();break;
    case'addAux':S.techs.push(tech({name:'Nova Técnica Auxiliar',cat:'auxiliar',pp:2,act:'bonus',form:'aux',dn:0}));renderEditor();break;
    case'addCustom':S.custom.push({id:uid(),name:'Nova característica',slot:'asp',eff:'none',v:0,val:'',text:''});renderEditor();break;
    case'btnNew':openConfirm('Começar uma ficha em branco? A ficha atual continua na biblioteca só se você a tiver salvado.','Nova ficha',()=>{S=blank();renderEditor()});break;
    case'btnCopy':{const t=blockText(lastR);(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Ficha copiada')).catch(()=>openText('Copiar ficha',t));break}
    case'btnSave':{const lib=store.get('opEnemyLib')||[];const i=lib.findIndex(x=>x.name===S.name);const entry={name:S.name,nd:ND_LABELS[lastR.finalIdx],data:JSON.parse(JSON.stringify(S)),at:Date.now()};if(i>=0)lib[i]=entry;else lib.push(entry);store.set('opEnemyLib',lib);toast(`"${S.name}" salvo na biblioteca`);break}
    case'btnLib':openLib();break;
    case'btnIO':openIO();break;
  }});
/* ============ MODAIS ============ */
function modal(html){$('#modalRoot').innerHTML=`<div class="modal" id="mdl"><div role="dialog" aria-modal="true">${html}</div></div>`;$('#mdl').addEventListener('click',e=>{if(e.target.id==='mdl'||e.target.dataset.close)closeModal()})}
function closeModal(){$('#modalRoot').innerHTML=''}
function openConfirm(msg,label,fn){modal(`<h3>${esc(label)}</h3><p>${esc(msg)}</p><div class="row"><button class="primary" id="okC">${esc(label)}</button><button data-close="1">Cancelar</button></div>`);$('#okC').onclick=()=>{closeModal();fn()}}
function openText(title,txt){modal(`<h3>${esc(title)}</h3><p class="note">A cópia automática não está disponível aqui. O texto já está selecionado: use Ctrl+C.</p><textarea id="txtOut" style="min-height:300px;font-family:var(--mono);font-size:12px">${esc(txt)}</textarea><div class="row"><button data-close="1">Fechar</button></div>`);const t=$('#txtOut');t.focus();t.select()}
function openLib(){const lib=store.get('opEnemyLib')||[];
  modal(`<h3>Biblioteca</h3><p class="note">Fichas salvas neste navegador.</p>${lib.length?lib.map((x,i)=>`<div class="lib-item"><span><b>${esc(x.name)}</b> <span class="pill">ND ${esc(x.nd)}</span></span><span class="row"><button class="small" data-load="${i}">Abrir</button><button class="small danger" data-rm="${i}">Excluir</button></span></div>`).join(''):'<p>Nenhuma ficha salva ainda. Use "Salvar na biblioteca" na ficha.</p>'}<div class="row"><button data-close="1">Fechar</button></div>`);
  $('#mdl').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.load){S=Object.assign(blank(),lib[+b.dataset.load].data);closeModal();renderEditor();toast('Ficha aberta')}
    if(b.dataset.rm){lib.splice(+b.dataset.rm,1);store.set('opEnemyLib',lib);openLib()}})}
function openIO(){modal(`<h3>Importar / exportar</h3><p class="note">Copie o JSON para guardar a ficha ou compartilhar com outro narrador. Para importar, cole um JSON ou escolha um arquivo .json.</p>
  <textarea id="ioTxt" style="min-height:220px;font-family:var(--mono);font-size:12px">${esc(JSON.stringify(S,null,1))}</textarea>
  <div class="row"><button id="ioCopy">Copiar JSON</button><button class="primary" id="ioLoad">Importar texto</button><label class="btn" for="ioFile" style="cursor:pointer">Escolher arquivo</label><input type="file" id="ioFile" accept=".json,application/json" hidden><button data-close="1">Fechar</button></div><p class="note" id="ioMsg"></p>`);
  $('#ioCopy').onclick=()=>{const t=$('#ioTxt');(navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).then(()=>toast('JSON copiado')).catch(()=>{t.focus();t.select();$('#ioMsg').textContent='Texto selecionado: use Ctrl+C.'})};
  const load=txt=>{try{const d=JSON.parse(txt);if(!d||typeof d!=='object'||!d.attrs)throw 0;S=Object.assign(blank(),d);closeModal();renderEditor();toast('Ficha importada')}catch(e){$('#ioMsg').textContent='Esse texto não é uma ficha válida do Estaleiro. Confira se copiou o JSON inteiro.'}};
  $('#ioLoad').onclick=()=>load($('#ioTxt').value);
  $('#ioFile').onchange=e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>load(r.result);r.readAsText(file)}}

$('#presetSel').innerHTML=`<option value="">Carregar exemplo do Manual…</option>`+PRESETS.map((p,i)=>`<option value="${i}">${esc(p[0])}</option>`).join('');
renderEditor();
</script>
</body>
</html>
